services:
  # Redis Cluster - 3 master nodes (minimal setup for development)
  redis-node-1:
    image: "redis:latest"
    container_name: "redis-node-1"
    command: redis-server --port 7000
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 200mb
      --maxmemory-policy noeviction
      --bind 0.0.0.0
      --protected-mode no
    ports:
      - "7000:7000"
      - "17000:17000"
    volumes:
      - redis_node_1:/data
    networks:
      - redis-cluster
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7000", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis-node-2:
    image: "redis:latest"
    container_name: "redis-node-2"
    command: redis-server --port 7001
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 200mb
      --maxmemory-policy noeviction
      --bind 0.0.0.0
      --protected-mode no
    ports:
      - "7001:7001"
      - "17001:17001"
    volumes:
      - redis_node_2:/data
    networks:
      - redis-cluster
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7001", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  redis-node-3:
    image: "redis:latest"
    container_name: "redis-node-3"
    command: redis-server --port 7002
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --appendonly yes
      --maxmemory 200mb
      --maxmemory-policy noeviction
      --bind 0.0.0.0
      --protected-mode no
    ports:
      - "7002:7002"
      - "17002:17002"
    volumes:
      - redis_node_3:/data
    networks:
      - redis-cluster
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "7002", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Cluster initialization service (runs once then exits)
  redis-cluster-init:
    image: "redis:latest"
    container_name: "redis-cluster-init"
    command: >
      bash -c "
        echo 'Waiting for Redis nodes...'
        sleep 10
        STATE=$$(redis-cli -h redis-node-1 -p 7000 cluster info | grep cluster_state | cut -d: -f2 | tr -d '[:space:]')
        if [ \"$$STATE\" = 'ok' ]; then echo 'Cluster already healthy, skipping init.'; exit 0; fi
        echo 'Flushing and resetting all Redis nodes (clears data and cluster state)...'
        redis-cli -h redis-node-1 -p 7000 FLUSHALL || echo 'Failed to flush redis-node-1'
        redis-cli -h redis-node-2 -p 7001 FLUSHALL || echo 'Failed to flush redis-node-2'
        redis-cli -h redis-node-3 -p 7002 FLUSHALL || echo 'Failed to flush redis-node-3'
        redis-cli -h redis-node-1 -p 7000 CLUSTER RESET HARD || echo 'Failed to reset redis-node-1'
        redis-cli -h redis-node-2 -p 7001 CLUSTER RESET HARD || echo 'Failed to reset redis-node-2'
        redis-cli -h redis-node-3 -p 7002 CLUSTER RESET HARD || echo 'Failed to reset redis-node-3'
        echo 'All nodes reset. Creating cluster...'
        sleep 2
        redis-cli --cluster create redis-node-1:7000 redis-node-2:7001 redis-node-3:7002 --cluster-yes
        echo 'Verifying cluster is ready...'
        for i in $$(seq 1 30); do
          STATE=$$(redis-cli -h redis-node-1 -p 7000 cluster info | grep cluster_state | cut -d: -f2 | tr -d '[:space:]')
          if [ \"$$STATE\" = 'ok' ]; then echo 'Redis Cluster is ready and healthy!'; exit 0; fi
          echo \"Waiting for cluster to stabilize... ($$i/30)\"; sleep 1
        done
        echo 'ERROR: Cluster failed to reach ready state after 30 seconds'; exit 1
      "
    depends_on:
      redis-node-1:
        condition: service_healthy
      redis-node-2:
        condition: service_healthy
      redis-node-3:
        condition: service_healthy
    networks:
      - redis-cluster

  mongodb:
    image: "mongo:latest"
    container_name: "mongodb_container"
    mem_limit: 1024m
    memswap_limit: 1280m
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

volumes:
  redis_node_1:
  redis_node_2:
  redis_node_3:
  mongodb_data:

networks:
  redis-cluster:
    driver: bridge
