services:
  redis-node-1:
    image: "redis:latest"
    container_name: "redis_node_1"
    mem_limit: 300m
    memswap_limit: 300m
    command: redis-server --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --bind 0.0.0.0
      --cluster-announce-ip redis-node-1
      --maxmemory-policy noeviction
      --maxmemory 256mb
      --appendonly yes
      --save ""
      --tcp-keepalive 60
      --timeout 0
      --activedefrag yes
    ports:
      - "8001:6379"
      - "18001:16379"
    networks:
      - redis-cluster
    volumes:
      - redis_data_1:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--cluster", "info", "|", "grep", "cluster_state:ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

