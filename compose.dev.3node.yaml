services:
  # Minimal 3-node Redis cluster for development
  redis-node-1:
    image: "redis:latest"
    container_name: "redis_node_1"
    command: >
      redis-server --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --bind 0.0.0.0
      --cluster-announce-ip redis-node-1
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
      --maxmemory 600mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
      --maxmemory-samples 5
      --activedefrag no
      --repl-backlog-size 16mb
      --tcp-backlog 511
      --slowlog-max-len 0
    ports:
      - "8001:6379"
      - "18001:16379"
    networks:
      - redis-cluster
    volumes:
      - redis_data_1:/data
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 256M

  redis-node-2:
    image: "redis:latest"
    container_name: "redis_node_2"
    command: >
      redis-server --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --bind 0.0.0.0
      --cluster-announce-ip redis-node-2
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
      --maxmemory 600mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
      --maxmemory-samples 5
      --activedefrag no
      --repl-backlog-size 16mb
      --tcp-backlog 511
      --slowlog-max-len 0
    ports:
      - "8002:6379"
      - "18002:16379"
    networks:
      - redis-cluster
    volumes:
      - redis_data_2:/data
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 256M

  redis-node-3:
    image: "redis:latest"
    container_name: "redis_node_3"
    command: >
      redis-server --port 6379
      --cluster-enabled yes
      --cluster-config-file nodes.conf
      --cluster-node-timeout 5000
      --bind 0.0.0.0
      --cluster-announce-ip redis-node-3
      --cluster-announce-port 6379
      --cluster-announce-bus-port 16379
      --maxmemory 600mb
      --maxmemory-policy noeviction
      --save ""
      --appendonly no
      --maxmemory-samples 5
      --activedefrag no
      --repl-backlog-size 16mb
      --tcp-backlog 511
      --slowlog-max-len 0
    ports:
      - "8003:6379"
      - "18003:16379"
    networks:
      - redis-cluster
    volumes:
      - redis_data_3:/data
    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 768M
        reservations:
          cpus: '0.1'
          memory: 256M

  redis-cluster-init:
    image: redis:latest
    command: >
      /bin/sh -c '
        echo "Waiting for Redis nodes..." &&
        until redis-cli -h redis-node-1 ping; do sleep 1; done &&
        until redis-cli -h redis-node-2 ping; do sleep 1; done &&
        until redis-cli -h redis-node-3 ping; do sleep 1; done &&
        echo "Flushing existing data..." &&
        redis-cli -h redis-node-1 FLUSHALL &&
        redis-cli -h redis-node-2 FLUSHALL &&
        redis-cli -h redis-node-3 FLUSHALL &&
        echo "All nodes are up. Resetting cluster state..." &&
        redis-cli -h redis-node-1 CLUSTER RESET HARD &&
        redis-cli -h redis-node-2 CLUSTER RESET HARD &&
        redis-cli -h redis-node-3 CLUSTER RESET HARD &&
        echo "Creating cluster..." &&
        redis-cli --cluster create \
          redis-node-1:6379 redis-node-2:6379 redis-node-3:6379 \
          --cluster-replicas 0 --cluster-yes &&
        echo "Cluster initialization complete. Verifying..." &&
        redis-cli -h redis-node-1 cluster nodes
      '
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
    networks:
      - redis-cluster
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

  mongodb:
    image: "mongo:latest"
    container_name: "mongodb_container"
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - redis-cluster
    environment:
      MONGO_INITDB_ROOT_USERNAME: ""
      MONGO_INITDB_ROOT_PASSWORD: ""
    command: >
      mongod
      --wiredTigerCacheSizeGB 0.5
      --bind_ip_all
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 768M
        reservations:
          cpus: '0.2'
          memory: 256M

  postgres:
    image: "postgres:16-alpine"
    container_name: "postgres_container"
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: bidding_bot
      POSTGRES_PASSWORD: bidding_bot_password
      POSTGRES_DB: bidding_bot_db
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    command: >
      postgres
      -c shared_buffers=128MB
      -c effective_cache_size=512MB
      -c maintenance_work_mem=32MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=4MB
      -c default_statistics_target=50
      -c random_page_cost=1.1
      -c effective_io_concurrency=100
      -c work_mem=2MB
      -c min_wal_size=256MB
      -c max_wal_size=1GB
      -c max_worker_processes=2
      -c max_parallel_workers_per_gather=1
      -c max_parallel_workers=2
      -c max_connections=50
      -c log_min_duration_statement=1000
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - redis-cluster
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bidding_bot"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '0.4'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

volumes:
  redis_data_1:
  redis_data_2:
  redis_data_3:
  mongodb_data:
  postgres_data:

networks:
  redis-cluster:
    driver: bridge