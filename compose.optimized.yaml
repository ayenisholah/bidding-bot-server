services:
  server:
    image: nfttools/bidding-bot-server-production:latest
    platform: linux/amd64
    restart: always
    # Server gets largest memory allocation (4GB)
    mem_limit: 4096m
    memswap_limit: 4608m
    # CPU limits: 2.5 cores for server
    cpus: "2.5"
    cpu_shares: 2048
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3003/health || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s
    environment:
      PORT: 3003
      # Node memory optimized for 4GB container limit
      NODE_OPTIONS: "--max-old-space-size=3584"
      # MongoDB connection pool optimization
      MONGO_MAX_POOL_SIZE: "25"
      MONGO_MIN_POOL_SIZE: "2"
      REDIS_HOST: "redis"
      REDIS_PORT: "6379"
      # Redis connection pooling
      REDIS_MAX_RETRIES: "3"
      REDIS_CONNECTION_TIMEOUT: "5000"
      ALCHEMY_API_KEY: "Vt4-KnmnLA7XAlfDkeWij"
      MONGODB_URI: "mongodb://mongodb:27017/BIDDING_BOT"
      SERVER_IP: ${SERVER_IP}
      USERNAME: ${USERNAME}
      EMAIL: ${EMAIL}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      JWT_SECRET: "NFTTOOLS TO THE MOON"
      AXIOM_DATASET: "nft-bidding-bot"
      AXIOM_TOKEN: "xaat-30ecb9c3-ce16-42f6-b824-ba8ef5c50e7c"
      API_KEY: ${API_KEY}
      RATE_LIMIT: ${RATE_LIMIT}
      # Performance tuning
      UV_THREADPOOL_SIZE: "8"
      NODE_ENV: "production"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - my_network
    volumes:
      - server_data:/app/data
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc:
        soft: 4096
        hard: 4096

  client:
    image: nfttools/bidding-bot-client-production:latest
    platform: linux/amd64
    restart: always
    # Client gets minimal memory (384MB)
    mem_limit: 384m
    memswap_limit: 512m
    # CPU limits: 0.5 cores for client
    cpus: "0.5"
    cpu_shares: 512
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      NODE_OPTIONS: "--max-old-space-size=256"
      BODY_SIZE_LIMIT: 104857600
      NEXT_PUBLIC_ALCHEMY_API_KEY: "Vt4-KnmnLA7XAlfDkeWij"
      NEXT_PUBLIC_API_KEY: ${API_KEY}
      NEXT_PUBLIC_AXIOM_DATASET: "nft-bidding-bot"
      NEXT_PUBLIC_AXIOM_TOKEN: "xaat-30ecb9c3-ce16-42f6-b824-ba8ef5c50e7c"
      NEXT_PUBLIC_USERNAME: ${USERNAME}
      NEXT_PUBLIC_MONGODB_URI: "mongodb://mongodb:27017/BIDDING_BOT"
      NEXT_PUBLIC_JWT_SECRET: "NFTTOOLS TO THE MOON"
      NEXT_PUBLIC_SERVER_IP: ${SERVER_IP}
      NEXT_PUBLIC_EMAIL: ${EMAIL}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3001/api/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      - mongodb
      - server
    networks:
      - my_network

  mongodb:
    image: "mongo:7-jammy"
    container_name: "mongodb_container"
    # MongoDB gets 2GB memory
    mem_limit: 2048m
    memswap_limit: 2560m
    # CPU limits: 0.75 cores for MongoDB
    cpus: "0.75"
    cpu_shares: 768
    command: >
      mongod 
      --wiredTigerCacheSizeGB 1.5
      --wiredTigerJournalCompressor snappy
      --wiredTigerCollectionBlockCompressor snappy
      --wiredTigerIndexPrefixCompression true
      --setParameter diagnosticDataCollectionEnabled=false
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - my_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  redis:
    image: "redis:7-alpine"
    container_name: "redis"
    # Redis gets 1GB memory
    mem_limit: 1024m
    memswap_limit: 1280m
    # CPU limits: 0.25 cores for Redis
    cpus: "0.25"
    cpu_shares: 256
    command: >
      redis-server
      --port 6379
      --bind 0.0.0.0
      --protected-mode no
      --maxmemory 896mb
      --maxmemory-policy allkeys-lru
      --maxmemory-samples 5
      --appendonly yes
      --appendfsync everysec
      --aof-rewrite-incremental-fsync yes
      --save ""
      --tcp-keepalive 60
      --timeout 300
      --tcp-backlog 511
      --databases 16
      --hz 10
      --loglevel warning
      --latency-monitor-threshold 100
      --activedefrag yes
      --active-defrag-ignore-bytes 100mb
      --active-defrag-threshold-lower 10
      --active-defrag-threshold-upper 25
      --active-defrag-cycle-min 1
      --active-defrag-cycle-max 25
      --io-threads 2
      --io-threads-do-reads yes
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - my_network
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    sysctls:
      - net.core.somaxconn=511

  # Optional monitoring with minimal resources
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    container_name: cadvisor
    mem_limit: 128m
    cpus: "0.1"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks:
      - my_network
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  mongodb_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/mongodb
  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /var/lib/redis
  server_data:
    driver: local

networks:
  my_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
